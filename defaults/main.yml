# SPDX-License-Identifier: MIT
---
hardening_user_shell: /bin/bash
hardening_hostname: ""
ssh_pubkey_path: ""
firewalld_zone: public

baseline_packages:
  - firewalld
  - fail2ban
  - chrony
  - dnf-automatic
  - policycoreutils-python-utils

fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_ignoreip: "127.0.0.1/8 ::1"
