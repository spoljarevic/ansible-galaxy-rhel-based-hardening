---
- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded

- name: Reload fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: reloaded

- name: Reload sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded
